<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kampala Wall Art — Mural &amp; Graffiti Map</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17181C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wall Art">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#17181C;         /* asphalt night */
    --ink-2:#212228;       /* panel */
    --chalk:#F2F0EA;       /* off-white text */
    --chalk-dim:#A9A8AD;   /* muted text */
    --magenta:#E63E8C;     /* brand accent */
    --amber:#F5B729;       /* spray-paint gold — SAFE DURING DAY */
    --cyan:#31D8C9;        /* spray-paint teal — SAFE */
    --red:#E5484D;         /* warning red — UNSAFE */
    --line:#34353C;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  #map{
    position:absolute;
    inset:0;
  }

  /* ---- Top bar ---- */
  header{
    position:absolute;
    top:0; left:0; right:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    background:linear-gradient(180deg, rgba(23,24,28,0.95) 0%, rgba(23,24,28,0.0) 100%);
    pointer-events:none;
  }
  header .brand{
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(18px,3vw,26px);
    letter-spacing:0.5px;
    line-height:1;
    text-transform:uppercase;
    pointer-events:auto;
  }
  header .brand span{ color:var(--magenta); }
  header .tagline{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--chalk-dim);
    margin-top:4px;
    letter-spacing:0.5px;
  }

  /* ---- Legend ---- */
  .legend{
    position:absolute;
    top:18px; right:18px;
    z-index:1000;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 14px;
    display:flex;
    gap:16px;
    font-size:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .legend .item{ display:flex; align-items:center; gap:6px; color:var(--chalk-dim); }
  .legend .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .legend .dot.day{ background:var(--amber); }
  .legend .dot.safe{ background:var(--cyan); }
  .legend .dot.unsafe{ background:var(--red); }

  /* ---- Markers ---- */
  .mural-pin{
    width:34px; height:34px;
    border-radius:50% 50% 50% 0;
    transform: rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.45);
    border:2px solid rgba(23,24,28,0.6);
  }
  .mural-pin .icon-inner{
    transform: rotate(45deg);
    font-size:15px;
  }
  .mural-pin.day{ background:var(--amber); }
  .mural-pin.safe{ background:var(--cyan); }
  .mural-pin.unsafe{ background:var(--red); }

  /* ---- Popup styling ---- */
  .leaflet-popup-content-wrapper{
    background:var(--ink-2);
    color:var(--chalk);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:0;
    overflow:hidden;
  }
  .leaflet-popup-content{ margin:0; width:260px !important; }
  .leaflet-popup-tip{ background:var(--ink-2); }
  .leaflet-popup-close-button{ color:var(--chalk-dim) !important; }

  .popup-gallery{
    position:relative;
    width:100%;
    height:150px;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .gallery-track{
    display:flex;
    width:100%;
    height:100%;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .gallery-track::-webkit-scrollbar{ display:none; }
  .gallery-slide{
    position:relative;
    flex:0 0 100%;
    height:100%;
    scroll-snap-align:start;
  }
  .gallery-slide img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .year-badge{
    position:absolute;
    bottom:8px; left:8px;
    background:#000;
    color:#fff;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:3px 7px;
    border-radius:4px;
    letter-spacing:0.4px;
  }
  .gallery-dots{
    position:absolute;
    bottom:8px; right:8px;
    z-index:2;
    display:flex;
    gap:4px;
  }
  .gallery-dot{
    width:5px; height:5px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
  }
  .gallery-dot.active{ background:#fff; }
  .gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
    width:24px; height:24px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.5);
    color:#fff;
    font-size:14px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .gallery-arrow.prev{ left:8px; }
  .gallery-arrow.next{ right:8px; }

  .popup-body{ padding:14px 16px 16px; }
  .popup-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .popup-eyebrow.day{ color:var(--amber); }
  .popup-eyebrow.safe{ color:var(--cyan); }
  .popup-eyebrow.unsafe{ color:var(--red); }

  .popup-title{
    font-family:'Archivo Black', sans-serif;
    font-size:17px;
    line-height:1.15;
    margin:0 0 4px;
    text-transform:uppercase;
  }
  .popup-artist{
    font-size:13px;
    color:var(--chalk-dim);
    margin:0 0 10px;
  }
  .popup-artist b{ color:var(--chalk); font-weight:600; }
  .popup-desc{
    font-size:12.5px;
    color:var(--chalk-dim);
    line-height:1.4;
    margin:0 0 14px;
  }

  .btn-route{
    width:100%;
    border:none;
    border-radius:8px;
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    background:var(--chalk);
    color:var(--ink);
    transition:transform 0.12s ease, opacity 0.12s ease;
  }
  .btn-route:hover{ opacity:0.85; }
  .btn-route:active{ transform:scale(0.97); }

  .btn-route-secondary{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 12px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12px;
    cursor:pointer;
    background:transparent;
    color:var(--chalk-dim);
    margin-top:6px;
    transition:opacity 0.12s ease;
  }
  .btn-route-secondary:hover{ color:var(--chalk); border-color:var(--chalk-dim); }

  /* ---- Route info panel ---- */
  #route-panel{
    position:absolute;
    bottom:18px; left:18px;
    z-index:1000;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    max-width:280px;
    display:none;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  #route-panel.show{ display:block; }
  #route-panel .r-title{
    font-family:'Archivo Black', sans-serif;
    font-size:13px;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  #route-panel .r-stats{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--chalk-dim);
    margin:0 0 10px;
  }
  #route-panel .r-close{
    background:none; border:1px solid var(--line); color:var(--chalk-dim);
    border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer;
  }
  #route-panel .r-close:hover{ color:var(--chalk); }

  /* ---- Attribution tweak ---- */
  .leaflet-control-attribution{
    background:rgba(23,24,28,0.75) !important;
    color:var(--chalk-dim) !important;
  }
  .leaflet-control-attribution a{ color:var(--chalk-dim) !important; }

  /* ---- Loading / status message ---- */
  #status-msg{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:900;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 20px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--chalk-dim);
    text-align:center;
    max-width:260px;
  }
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div>
    <div class="brand">Kampala <span>Wall Art</span></div>
    <div class="tagline">MURALS &amp; GRAFFITI — FIND IT, SEE IT, GET THERE</div>
  </div>
</header>

<div class="legend">
  <div class="item"><span class="dot safe"></span>Safe</div>
  <div class="item"><span class="dot day"></span>Safe during day time</div>
  <div class="item"><span class="dot unsafe"></span>Unsafe</div>
</div>

<div id="route-panel">
  <div class="r-title" id="r-title">Route</div>
  <div class="r-stats" id="r-stats"></div>
  <button class="r-close" onclick="clearRoute()">Clear route</button>
</div>

<div id="status-msg">Loading murals…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ============================================================
   1. SITE DATA SOURCE
   ------------------------------------------------------------
   Sites now live in a Google Sheet, not in this file.
   Paste your published-to-web CSV link below.
   Sheet columns (exact header names, any order):
     name, artist, lat, lng, safety, description,
     photo, photo2, photo3, photo4
   safety values: safe | day | unsafe
   photo/photo2/photo3/photo4: filenames in /images (or full URLs) —
   leave later ones blank if a site has fewer than 4 photos.

   PHOTO NAMING (required): save photos as .jpg, named so the year
   is the last part before the extension, e.g.:
     Herman Padel Mural_2026.jpg
   The app reads the trailing "_YYYY" and shows it as the year
   badge automatically — no separate year column needed.
   ============================================================ */
const SHEET_CSV_URL = "PASTE_YOUR_PUBLISHED_GOOGLE_SHEET_CSV_LINK_HERE";

/* ============================================================
   2. MAP SETUP
   ============================================================ */
const map = L.map('map', { zoomControl: false }).setView([0.3476, 32.5825], 12); // Kampala, default view until sites load

L.control.zoom({ position: 'bottomright' }).addTo(map);

// Google Hybrid basemap (satellite imagery + road/place labels)
// Note: this uses Google's public tile endpoint directly rather than the official,
// key-based Maps JavaScript API — it's the only no-signup, no-billing way to pull
// Google's hybrid tiles, but it's unofficial and could change without notice.
L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
  attribution: 'Map data &copy; Google',
  subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
  maxZoom: 20
}).addTo(map);

/* ============================================================
   3. CUSTOM ICONS
   ============================================================ */
function iconFor(safety){
  const symbol = safety === 'day' ? '☀' : safety === 'unsafe' ? '⚠' : '✓';
  return L.divIcon({
    className: '',
    html: `<div class="mural-pin ${safety}"><div class="icon-inner">${symbol}</div></div>`,
    iconSize: [34, 34],
    iconAnchor: [17, 34],
    popupAnchor: [0, -30]
  });
}

/* ============================================================
   3b. PHOTO GALLERY HELPERS
   ============================================================ */
function resolveSrc(p){
  return /^https?:\/\//i.test(p) ? p : `images/${p}`;
}

// Reads the year from a filename like "Herman Padel Mural_2026.jpg"
function extractYear(pathOrUrl){
  const filename = pathOrUrl.split('/').pop();
  const match = filename.match(/_([12]\d{3})\.jpe?g$/i);
  return match ? match[1] : '';
}

function imagesFor(site){
  return [site.photo, site.photo2, site.photo3, site.photo4]
    .filter(p => p)
    .map(p => ({ src: resolveSrc(p), year: extractYear(p) }));
}

function galleryHtml(images, siteName){
  if (!images.length) {
    return `<div class="popup-gallery"><div class="gallery-track"><div class="gallery-slide">
      <img src="https://placehold.co/260x150/212228/A9A8AD?text=Add+photo" alt="${siteName}" />
    </div></div></div>`;
  }

  const slides = images.map(im => `
    <div class="gallery-slide">
      <img src="${im.src}" alt="${siteName}"
           onerror="this.src='https://placehold.co/260x150/212228/A9A8AD?text=Add+photo';" />
      ${im.year ? `<span class="year-badge">${im.year}</span>` : ''}
    </div>
  `).join('');

  const dots = images.length > 1
    ? `<div class="gallery-dots">${images.map((_, i) => `<span class="gallery-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}</div>`
    : '';

  const arrows = images.length > 1
    ? `<button class="gallery-arrow prev" onclick="scrollGallery(this,-1)">&#8249;</button>
       <button class="gallery-arrow next" onclick="scrollGallery(this,1)">&#8250;</button>`
    : '';

  return `<div class="popup-gallery"><div class="gallery-track">${slides}</div>${dots}${arrows}</div>`;
}

function scrollGallery(btn, dir){
  const track = btn.closest('.popup-gallery').querySelector('.gallery-track');
  track.scrollBy({ left: dir * track.clientWidth, behavior: 'smooth' });
}

// Keeps the dot indicator in sync as the user swipes/scrolls through photos
function wireGalleryScroll(e){
  const el = e.popup.getElement();
  const track = el.querySelector('.gallery-track');
  const dots = el.querySelectorAll('.gallery-dot');
  if (!track || !dots.length) return;
  track.addEventListener('scroll', () => {
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  });
}


/* ============================================================
   4. LOAD SITES FROM GOOGLE SHEET, THEN BUILD MARKERS + POPUPS
   ============================================================ */
const markers = {};
const statusEl = document.getElementById('status-msg');

async function loadSites(){
  if (SHEET_CSV_URL.includes('PASTE_YOUR')) {
    statusEl.textContent = 'No sheet connected yet — see README to link your Google Sheet.';
    return;
  }
  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
    const csvText = await res.text();

    const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });

    const sites = parsed.data
      .map((row, i) => ({
        id: i + 1,
        name: (row.name || 'Unknown').trim(),
        artist: (row.artist || 'Unknown').trim(),
        lat: parseFloat(row.lat),
        lng: parseFloat(row.lng),
        safety: (row.safety || 'safe').trim().toLowerCase(),
        description: (row.description || '').trim(),
        photo: (row.photo || '').trim(),
        photo2: (row.photo2 || '').trim(),
        photo3: (row.photo3 || '').trim(),
        photo4: (row.photo4 || '').trim()
      }))
      .filter(s => !isNaN(s.lat) && !isNaN(s.lng));

    buildMarkers(sites);

  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Could not load mural data. Check the sheet link and publish settings.';
  }
}

function buildMarkers(sites){
  if (!sites.length) {
    statusEl.textContent = 'No sites yet — add a row to your Google Sheet.';
    return;
  }

  sites.forEach(site => {
    const marker = L.marker([site.lat, site.lng], { icon: iconFor(site.safety) }).addTo(map);

    const safetyLabel = site.safety === 'day' ? 'Safe during day time'
                       : site.safety === 'unsafe' ? 'Unsafe'
                       : 'Safe';

    const images = imagesFor(site);
    const escapedName = site.name.replace(/'/g, "\\'");

    const popupHtml = `
      ${galleryHtml(images, site.name)}
      <div class="popup-body">
        <div class="popup-eyebrow ${site.safety}">${safetyLabel}</div>
        <p class="popup-title">${site.name}</p>
        <p class="popup-artist">Artist: <b>${site.artist}</b></p>
        <p class="popup-desc">${site.description || ''}</p>
        <button class="btn-route" onclick="routeTo(${site.lat}, ${site.lng}, '${escapedName}', 'hybrid')">
          Drive + walk directions
        </button>
        <button class="btn-route-secondary" onclick="routeTo(${site.lat}, ${site.lng}, '${escapedName}', 'walk')">
          Walking directions only
        </button>
      </div>
    `;

    marker.bindPopup(popupHtml);
    marker.on('popupopen', wireGalleryScroll);
    markers[site.id] = marker;
  });

  const bounds = L.latLngBounds(sites.map(s => [s.lat, s.lng]));
  map.fitBounds(bounds, { padding: [80, 80] });

  statusEl.style.display = 'none';
}

loadSites();

/* ============================================================
   5. ROUTING (free — OSRM public demo server, no API key)
   ------------------------------------------------------------
   mode "hybrid": drive as far as a road reaches, then walk the
   rest of the way if the site sits off-road (footpaths, slums, etc).
   mode "walk": walking directions the whole way.
   ============================================================ */
let routeLayer = null;
let userMarker = null;

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function fetchOsrmRoute(profile, fromLat, fromLng, toLat, toLng){
  const url = `https://router.project-osrm.org/route/v1/${profile}/${fromLng},${fromLat};${toLng},${toLat}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Routing request failed: ' + res.status);
  const data = await res.json();
  if (!data.routes || !data.routes.length) throw new Error('No route found');
  return { route: data.routes[0], waypoints: data.waypoints };
}

function routeTo(destLat, destLng, destName, mode){
  if (!navigator.geolocation) {
    alert('Your browser does not support location. Try a different device/browser.');
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const userLat = pos.coords.latitude;
    const userLng = pos.coords.longitude;

    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([userLat, userLng], {
      radius: 7, color: '#31D8C9', fillColor: '#31D8C9', fillOpacity: 1, weight: 2
    }).addTo(map).bindPopup('You are here');

    if (mode === 'walk') {
      await drawWalkingRoute(userLat, userLng, destLat, destLng, destName);
    } else {
      await drawHybridRoute(userLat, userLng, destLat, destLng, destName);
    }
  }, () => {
    alert('Could not get your location. Please allow location access and try again.');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

async function drawWalkingRoute(userLat, userLng, destLat, destLng, destName){
  try {
    const { route } = await fetchOsrmRoute('foot', userLat, userLng, destLat, destLng);
    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(coords, { color: '#31D8C9', weight: 5, opacity: 0.9 }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });

    const km = (route.distance / 1000).toFixed(2);
    const mins = Math.round(route.duration / 60);
    document.getElementById('r-title').textContent = `Walking to ${destName}`;
    document.getElementById('r-stats').textContent = `${km} km · ~${mins} min on foot`;
    document.getElementById('route-panel').classList.add('show');

  } catch (err) {
    console.error(err);
    alert('Could not find a walking route to this site.');
  }
}

async function drawHybridRoute(userLat, userLng, destLat, destLng, destName){
  try {
    const { route: driveRoute, waypoints } = await fetchOsrmRoute('driving', userLat, userLng, destLat, destLng);
    const snapLng = waypoints[1].location[0];
    const snapLat = waypoints[1].location[1];
    const gapMeters = haversineMeters(snapLat, snapLng, destLat, destLng);

    const driveCoords = driveRoute.geometry.coordinates.map(c => [c[1], c[0]]);
    const layers = [L.polyline(driveCoords, { color: '#F5B729', weight: 5, opacity: 0.85 })];
    const statsParts = [`${(driveRoute.distance/1000).toFixed(1)} km drive (~${Math.round(driveRoute.duration/60)} min)`];
    let title = `Driving to ${destName}`;

    // If the nearest road is meaningfully far from the actual site, walk the rest of the way
    if (gapMeters > 60) {
      const { route: walkRoute } = await fetchOsrmRoute('foot', snapLat, snapLng, destLat, destLng);
      const walkCoords = walkRoute.geometry.coordinates.map(c => [c[1], c[0]]);
      layers.push(L.polyline(walkCoords, { color: '#31D8C9', weight: 5, opacity: 0.9, dashArray: '6 6' }));
      statsParts.push(`${(walkRoute.distance/1000).toFixed(2)} km walk (~${Math.round(walkRoute.duration/60)} min)`);
      title = `Drive + walk to ${destName}`;
    }

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.layerGroup(layers).addTo(map);

    const allLatLngs = layers.flatMap(l => l.getLatLngs());
    map.fitBounds(L.latLngBounds(allLatLngs), { padding: [60, 60] });

    document.getElementById('r-title').textContent = title;
    document.getElementById('r-stats').textContent = statsParts.join('  +  ');
    document.getElementById('route-panel').classList.add('show');

  } catch (err) {
    console.warn('Driving route unavailable, falling back to walking directions', err);
    await drawWalkingRoute(userLat, userLng, destLat, destLng, destName);
  }
}

function clearRoute(){
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
  document.getElementById('route-panel').classList.remove('show');
}

/* ============================================================
   6. PWA — makes "Add to Home Screen" / Install available
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed', err));
  });
}
</script>
